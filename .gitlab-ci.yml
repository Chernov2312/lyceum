image: python:3.13

stages:
  - lint
  - dependencies
  - test

dependencies_test:
  stage: dependencies
  script:
    - pip install -r requirements/test.txt
  artifacts:
    paths:
      - .cache/pip
    expire_in: 1 hour

dependencies_django_test:
  stage: dependencies
  script:
    - pip install -r requirements/prod.txt
    - pip install -r requirements/dev.txt
  artifacts:
    paths:
      - .cache/pip
    expire_in: 1 hour

flake8:
  stage: lint
  needs: ["dependencies_test"]
  script:
    - flake8 --verbose

black:
  stage: lint
  needs: ["dependencies_test"]
  script:
    - black --check  --diff .

django_test:
  stage: test
  needs: ["dependencies_django_test"]
  script:
    - cd lyceum
    - python3 manage.py test
  