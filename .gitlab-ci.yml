image: Python:3.13.9

stages:
  - lint

flake8:
  stage: lint
  image: registry.gitlab.com/pipeline-components/flake8:latest
  script:
    - pip install flake8 flake8-quotes pep8-naming flake8-import-order flake8-bugbear
    - flake8 --verbose

black:
  stage: lint
  image: Python:3.13.9
  script:
    - pip install black
    - black --check --diff .