image: python:3.13

stages:
  - dependencies
  - lint
  - test

cache:
  paths:
    - .cache/pip
  key: "$CI_COMMIT_REF_SLUG"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

install_dependencies:
  stage: dependencies
  script:
    - pip install --upgrade pip
    - pip install -r requirements/prod.txt
    - pip install -r requirements/dev.txt
    - pip install -r requirements/test.txt
  artifacts:
    paths:
      - .cache/pip
    expire_in: 1 hour

flake8:
  stage: lint
  needs: ["install_dependencies"]
  script:
    - pip install flake8
    - flake8 --verbose

black:
  stage: lint
  needs: ["install_dependencies"]
  script:
    - pip install black
    - black --check --diff .

django_test:
  stage: test
  needs: ["install_dependencies"]
  script:
    - cd lyceum
    - python manage.py test