{% extends "base.html" %}

{% block title %}Echo-форма{% endblock title %}

{% block content %}
<div class="container mt-4">
    <h1>Echo-форма</h1>
    <p class="lead">Введите текст, и он вернется вам в чистом виде</p>
    
    <form method="post" action="{% url 'main:echo_submit' %}">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="{{ form.text.id_for_label }}" class="form-label">
                {{ form.text.label }}
            </label>
            {{ form.text }}
            {% if form.text.errors %}
                <div class="alert alert-danger mt-2">
                    {{ form.text.errors }}
                </div>
            {% endif %}
        </div>
        
        <button type="submit" class="btn btn-primary">Отправить</button>
    </form>
</div>
{% endblock content %}
