{% extends "base.html" %}
{% block title %}Обратная связь{% endblock title %}
{% block content %}
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">
            {{ field.label }}
        </label>
        {{ field }}
        {% if field.errors %}
            <div class="alert alert-danger">
                {{ field.errors }}
            </div>
        {% endif %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Отправить</button>
</form>
{% endblock content %}
