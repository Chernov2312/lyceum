{% extends "base.html" %}
{% block title %}Обратная связь{% endblock title %}
{% block content %}
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">
            {{ field.label }}
        </label>
    {% endfor %}
{% endblock content %}
