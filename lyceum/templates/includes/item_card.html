{% load static %}
<div class="card">
    {{ item.get_main_image_tmb|safe }}
    <div class="card-body">
        <a class="nav-link" href="{% url 'catalog:item_detail' item.id %}">
            <h2 class="card-title">{{ item.name }}</h2>
        </a>
        <p class="card-text">{{ item.text }}</p>
    </div>
</div>
