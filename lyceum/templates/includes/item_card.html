{% load static %}
<div class="card">
    {{ item.main_image.image_tmb|safe }}
    <div class="card-body">
        {% if request.resolver_match.view_name == 'catalog:item_detail' %}
        <span class="nav-link active" href="{% url 'catalog:item_detail' item.id %}">
            <h2 class="card-title">{{ item.name }}</h2>
        </span>
        {% else %}
        <a class="nav-link" href="{% url 'catalog:item_detail' item.id %}">
            <h2 class="card-title">{{ item.name }}</h2>
        </a>
        {% endif%}
        <p class="card-text">{{ item.text }}</p>
    </div>
</div>
