{% load static %}
<div class="card">
    {{ item.main_image.image_tmb|safe }}
    <div class="card-body">
        {{item.get_all_images_tmb}}
        <h2 class="card-title">{{ item.name }}</h2>
        <h5 class="card-category">Категория: {{ item.category }}</h5>
        <p class="card-text">Описание: {{ item.text|safe }}</p>
        <h5>Тэги</h5>
        <ul>
            {% for tag in item.tags.all %}
            <li>{{ tag.name }}</li>
            {% endfor %}
        </ul>
    </div>
</div>
